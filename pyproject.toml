[project]
name = "quant"
version = "0.1.0"
description = "Pre-registered research harness for equity and crypto strategies"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pyarrow", "yfinance", "lxml", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
